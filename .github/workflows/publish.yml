---
name: Publish

on:
  push:
    branches: [master]
    tags:
      - v*

jobs:
  docker:
    if: ${{ github.repository_owner == 'solacecommunity' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `git describe` below needs the full tag history; the default shallow clone has none.
          fetch-depth: 0

      - name: Resolve build metadata
        id: build
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          # Strip the leading "v" of the git tag so the metric reads version="1.4.2", matching `make build`.
          version="${version#v}"
          {
            echo "version=${version}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "build_date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: crazy-max/ghaction-docker-meta@v6
        with:
          images: solacecommunity/solace-prometheus-exporter
          tags: |
            type=raw,value=latest,enable=${{ endsWith(GitHub.ref, 'master') }}
            type=raw,value=testing,enable=${{ contains(GitHub.head_ref, 'feature') }}
            type=ref,event=tag
          flavor: |

      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.3.0
        with:
          push: ${{ GitHub.event_name != 'pull_request' || contains(GitHub.head_ref, 'feature') }}
          tags: ${{ steps.meta.outputs.tags }}
          # Baked into the binary via -ldflags and served as solace_exporter_build_info on /metrics.
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.build_date }}
