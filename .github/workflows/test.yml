---
name: Test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches: [master]

jobs:
  lint-and-tidy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          args: ./...
          version: latest

      - name: Run tidy check
        run: |
          go mod tidy
          # Fail if go.mod or go.sum changed
          git diff --exit-code go.mod go.sum

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Run tests
        run: go test -v ./...

  oauth_e2e_test:
    name: OAuth E2E Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pre-pull docker images
        run: |
          docker compose -f test/oauth/docker-compose.yaml pull --ignore-buildable --ignore-pull-failures
        timeout-minutes: 15
      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@ee6af68587292d72db67743171809c19787df4c9 # v3.1.0
        with:
          compose-file: test/oauth/docker-compose.yaml
          up-flags: --wait --wait-timeout 600
          compose-version: latest
      - name: Check metric scrape service status
        run: |
          status=$(docker compose -f test/oauth/docker-compose.yaml ps -aq check_metric_scrape | xargs docker inspect -f '{{.State.ExitCode}}')
          if [ "$status" -eq 0 ]; then
            echo "E2E test successful: check_metric_scrape exited with code 0."
          else
            echo "E2E test failed: check_metric_scrape exited with code $status."
            exit 1
          fi
